<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="AppAttic">
  <rect width="128" height="128" rx="24" fill="#1e1e1e"/>
  <!-- the installed app, and the data it leaves behind -->
  <rect x="24" y="24" width="56" height="56" rx="12" fill="#2e2e2e"/>
  <rect x="48" y="48" width="56" height="56" rx="12" fill="#ff453a"/>
