# Local and CI entry: bash scripts/linux-flatpak.sh
# Runtime: org.kde.Platform (Qt 6). Queries the host via flatpak-spawn --host.
app-id: org.appattic.AppAttic
runtime: org.kde.Platform
runtime-version: "6.10"
# The branch belongs on the sdk for the same reason it belongs on the runtime:
# `sdk: org.kde.Sdk` alone resolves the SDK's default branch (master), so the
# build would compile against a different toolchain than the 6.10 runtime it
# installs, and scripts/linux-flatpak.sh, which puts org.kde.Sdk//6.10 on the
# host, would not have made the one that was used.
sdk: org.kde.Sdk//6.10
command: appattic-qt
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Leftover and disk scans walk real paths, and every package-manager query
  # runs on the host through flatpak-spawn, so no in-sandbox network is needed.
  #
  # `:ro`, not a bare `host`. Nothing this app does inside the sandbox writes to
  # a host path: the settings and the scan cache go to $XDG_DATA_HOME, which
  # Flatpak redirects into the sandbox, and the generated cleanup script is
  # written to the sandbox temp directory. The one action that does change host
  # state, "Move to Trash", leaves through the file-manager portal below. A
  # bare --filesystem=host is read *and* write on every host path, so a bug or
  # a hostile loaded plugin wrote the real filesystem with no portal in between
  # — which is the whole point of shipping the Flatpak at all. The generated
  # /bin/sh scripts that do remove host files run under flatpak-spawn --host,
  # outside the sandbox, so narrowing this grant does not stop a cleanup the
  # user confirmed.
  #
  # That is `ScriptProcess::start` (ui/linux-qt/scriptproc.cpp `scriptCommand`):
  # the run is `flatpak-spawn --host -- /bin/sh` with the script on stdin, since
  # the sandbox temp path above is not a path the host can open. It is the same
  # crossing core/host/hostexec.c makes for its allowlisted queries. If a run
  # ever went back to `sh <path>` inside the sandbox, every confirmed removal
  # would fail against a read-only host grant and this manifest's claim would
  # be false; `checkScriptLeavesTheSandbox` in ui/linux-qt/tests pins the shape.
  - --filesystem=host:ro
  - --talk-name=org.freedesktop.Flatpak
  # QFile::moveToTrash goes through the file manager portal.
  - --talk-name=org.freedesktop.FileManager1
# flatpak exports the icon under the app id and writes Icon=org.appattic.AppAttic
# into the desktop entry it puts on the host, so the icon in the prefix has to
# carry that name. The appattic module below installs the extra copy.
rename-icon: org.appattic.AppAttic
modules:
  - name: wasmtime
    buildsystem: simple
    build-commands:
      - install -d "${FLATPAK_DEST}/lib" "${FLATPAK_DEST}/include"
      - cp -a lib/libwasmtime.so* "${FLATPAK_DEST}/lib/"
      - cp -a include/. "${FLATPAK_DEST}/include/"
    # /include is removed by the appattic module below, which is the last one
    # to compile against wasmtime.h. flatpak-builder runs a module's cleanup
    # before the next module is built, so cleaning up here would leave the
    # appattic module without the header CMake looks for.
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/bytecodealliance/wasmtime/releases/download/v28.0.0/wasmtime-v28.0.0-x86_64-linux-c-api.tar.xz
        sha256: 23f282f333f07ec82a838928cbc86355cc4978c3618080d1a2e5714fec8411bf
        strip-components: 1
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/bytecodealliance/wasmtime/releases/download/v28.0.0/wasmtime-v28.0.0-aarch64-linux-c-api.tar.xz
        sha256: 6eeeae50f71a92120cb53d92d5fe57dc56cfcc03a9239dcd2ae5a06811c2233f
        strip-components: 1
  - name: zig
    buildsystem: simple
    build-commands:
      - install -d "${FLATPAK_DEST}/libexec/zig" "${FLATPAK_DEST}/bin"
      - cp -a zig lib "${FLATPAK_DEST}/libexec/zig/"
      - ln -s "${FLATPAK_DEST}/libexec/zig/zig" "${FLATPAK_DEST}/bin/zig"
    # core/build.sh compiles the WASM core in the appattic module, so the
    # toolchain has to outlive this module. The appattic module removes it.
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        strip-components: 1
      - type: archive
        only-arches:
          - aarch64
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        strip-components: 1
  - name: appattic
    buildsystem: simple
    build-commands:
      - |
        export PATH="${FLATPAK_DEST}/bin:${PATH}"
        export WASMTIME_DIR="${FLATPAK_DEST}"
        export APPATTIC_HOST_EXEC_FIXTURE=1
        bash core/build.sh
        cmake -S ui/linux-qt -B _qt -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${FLATPAK_DEST}" -DWASMTIME_ROOT="${FLATPAK_DEST}"
        # --parallel explicitly, the way scripts/linux-qt-link.sh and
        # scripts/linux-appimage.sh build the same tree: a flatpak-builder
        # sandbox does not always hand the module the host's core count, and
        # the UI is nine C++ translation units plus an automoc pass.
        cmake --build _qt --parallel
        cmake --install _qt
        install -Dm 644 packaging/appattic.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/org.appattic.AppAttic.svg"
    # Last module built, so the build-only inputs go here rather than in the
    # modules that provide them. The runtime links lib/libwasmtime.so and reads
    # the installed WASM modules; it never compiles anything.
    cleanup:
      - /include
      - /libexec/zig
      - /bin/zig
    sources:
      # The tree itself, so a local or CI build needs no published tarball.
      # A distribution build wants a released archive with a sha256 here
      # instead: Flatpak remotes have no way to fetch a dir source.
      - type: dir
        path: ../..
        # The same list scripts/linux-flatpak.sh reads and hands to rsync, so
        # the two cannot drift. .dockerignore is here because it is build
        # output for this build: it exists for `podman build` against the whole
        # tree, and nothing in this module reads it.
        skip:
          - .build
          - .deps
          - .dockerignore
          - .gauntlet
          - .git
          - .scratch
          - .tmp-shots
          - .zig-cache
          - .zig-cache-local
          - .github
          - AppAttic.app
          - benchmarks
          - core/out
          - dist
          - docs
          - tests
          - ui/linux-qt/build
          - ui/linux-qt/build-release
