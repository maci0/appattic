name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      # .swift-version, but without AppAtticUI: swift-cross-ui 0.2.1 needs a
      # Swift 6 compiler, and Swift 6.1's SIL lifetime pass crashes on
      # swift-mutex 0.0.6 (fixed on swift main only, not in 6.2). The macOS UI
      # build stays in release.yml (macos-ui), which is disabled until it is
      # stable again.
      - name: Test scan library
        env:
          APPATTIC_NO_MAC_UI: "1"
        run: swift test --filter AppAtticScanTests --disable-automatic-resolution
      - name: Build CLI
        env:
          APPATTIC_NO_MAC_UI: "1"
        run: swift build -c debug --product appattic --disable-automatic-resolution

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # scripts/lint.sh rejects AI tool credits in commit messages: full
          # history, or the check only ever sees the tip.
          fetch-depth: 0
      - name: Install shellcheck
        # scripts/linux-deps.sh, not a hand-written apt line: it is the install
        # path CONTRIBUTING.md documents and the one the other distro families
        # go through, so the lint job cannot drift from local setup.
        run: sudo bash scripts/linux-deps.sh --install-shellcheck
      - name: Install yamllint
        # Pinned: an unpinned linter makes a green run mean "whatever
        # yamllint shipped that morning", not "this tree passes". The pin is
        # repeated in scripts/deps.sh, which fails if the two disagree.
        run: uv tool install "yamllint==1.38.0"
      - name: Install zig
        run: sudo bash scripts/linux-deps.sh --install-zig
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Lint
        run: bash scripts/lint.sh

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      - name: Cache build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            .swiftpm
            .zig-cache
            .zig-cache-local
          # The toolchain version files belong in the key: a restore of a
          # .build or .zig-cache written by another Swift or Zig is a build
          # against a compiler this tree does not pin. No restore-keys
          # fallback for the same reason: a prefix that ignores the hash also
          # ignores the toolchain, so it would hand back exactly the cache the
          # key exists to keep out.
          key: >-
            ${{ runner.os }}-${{ github.job }}-${{
            hashFiles('Package.resolved', 'Package.swift', '.swift-version',
            '.zig-version', 'Sources/**/*.swift', 'tests/**/*.swift',
            'benchmarks/**/*.swift', 'core/src/**/*.zig') }}
      - name: Install Qt 6
        run: sudo bash scripts/linux-deps.sh --install
      - name: Distro deps
        run: bash scripts/linux-deps.sh
      - name: Install Wasmtime C API
        run: |
          sudo bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Test scan library
        run: swift test --filter AppAtticScanTests --disable-automatic-resolution
        id: swift_test
      - name: Build CLI
        run: swift build -c debug --product appattic --disable-automatic-resolution
        if: steps.swift_test.outcome == 'success'
      - name: Link Qt UI
        if: success() || failure()
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
      - name: Upload Qt link proof
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error
      - name: Upload UI renders
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt-shots-${{ github.job }}
          path: ui/linux-qt/build/shots/*.png
          if-no-files-found: warn

  jammy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swift:5.10.1-jammy
    steps:
      - name: Install git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cache build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .build
            .swiftpm
            .zig-cache
            .zig-cache-local
          # The toolchain version files belong in the key: a restore of a
          # .build or .zig-cache written by another Swift or Zig is a build
          # against a compiler this tree does not pin. No restore-keys
          # fallback for the same reason: a prefix that ignores the hash also
          # ignores the toolchain, so it would hand back exactly the cache the
          # key exists to keep out.
          key: >-
            ${{ runner.os }}-${{ github.job }}-${{
            hashFiles('Package.resolved', 'Package.swift', '.swift-version',
            '.zig-version', 'Sources/**/*.swift', 'tests/**/*.swift',
            'benchmarks/**/*.swift', 'core/src/**/*.zig') }}
      - name: Install Qt 6
        run: bash scripts/linux-deps.sh --install
      - name: Install Wasmtime C API
        run: |
          bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Test scan library
        run: swift test --filter AppAtticScanTests --disable-automatic-resolution
        id: swift_test_jammy
      - name: Build CLI
        run: swift build -c debug --product appattic --disable-automatic-resolution
        if: steps.swift_test_jammy.outcome == 'success'
      - name: Link Qt UI
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
      - name: Upload Qt link proof
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error

  archlinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - name: Install Qt 6 and build tools
        # No zig here: linux-deps.sh --install below puts the checksummed
        # .zig-version tarball on PATH instead of the pacman package.
        run: pacman -Syu --noconfirm --needed git qt6-base cmake ninja pkgconf gcc clang binutils curl tar xz libxml2 ncurses python libglvnd xorg-server-xvfb
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cache build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .zig-cache
            .zig-cache-local
          key: ${{ runner.os }}-${{ github.job }}-${{ hashFiles('.zig-version', 'core/src/**/*.zig') }}
      - name: Distro deps
        run: bash scripts/linux-deps.sh --install
      - name: Install Wasmtime C API
        run: |
          bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Link Qt UI
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
      - name: Upload Qt link proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error
