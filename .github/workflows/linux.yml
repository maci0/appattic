name: linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    # One place, so a step added later cannot miss it: every step in this job
    # builds without AppAtticUI.
    env:
      APPATTIC_NO_MAC_UI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      # .swift-version, but without AppAtticUI: swift-cross-ui 0.2.1 needs a
      # Swift 6 compiler, and Swift 6.1's SIL lifetime pass crashes on
      # swift-mutex 0.0.6 (fixed on swift main only, not in 6.2). The macOS UI
      # build stays in release.yml (macos-ui), which is disabled until it is
      # stable again.
      - name: Test scan library
        run: bash scripts/test.sh
      - name: Build CLI
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/swift-build.sh
          . scripts/swift-build.sh
          appattic_swift_build debug --product appattic

  lint:
    runs-on: ubuntu-24.04
    # 30, not 15: this job is a full-history checkout (scripts/lint.sh reads
    # every commit message), shellcheck over every script in the tree, and the
    # three C passes GCC -fanalyzer, clang --analyze and ASan+UBSan. On a
    # loaded runner the 15 the job used to carry expired on the analyzer, so
    # the run failed on a timeout that says nothing about the tree.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/lint.sh rejects AI tool credits in commit messages: full
          # history, or the check only ever sees the tip.
          fetch-depth: 0
      - name: Install shellcheck
        # scripts/linux-deps.sh, not a hand-written apt line: it is the install
        # path CONTRIBUTING.md documents and the one the other distro families
        # go through, so the lint job cannot drift from local setup.
        run: sudo bash scripts/linux-deps.sh --install-shellcheck
      - name: Install desktop-file-utils
        # scripts/check-packaging.sh runs desktop-file-validate on the desktop
        # entry and names the skip when the tool is absent. Installing it here
        # is what keeps that check blocking in CI rather than a note.
        run: sudo bash scripts/linux-deps.sh --install-desktop-file-utils
      - name: Install yamllint
        # Pinned: an unpinned linter makes a green run mean "whatever
        # yamllint shipped that morning", not "this tree passes". The pin is
        # read out of scripts/deps.sh rather than written here a second time,
        # so the workflow and the pin cannot disagree: deps.sh is the one
        # place the version is written, and `deps.sh yamllint-version` is the
        # subcommand that prints it. The pip form is the one that works
        # unquoted-as-a-word, so the version expands into it as one argument.
        # pipx, not `uv tool install`: the runner image ships pipx and no uv,
        # so the uv spelling is a step that never finds its own tool.
        run: pipx install "yamllint==$(bash scripts/deps.sh yamllint-version)"
      - name: Install Wasmtime C API
        # embed.c is the WASM loader, and the C gate compiles every source
        # under core/host. Without these headers it is the one file the gate
        # skips, which is the file most worth a warnings-as-errors pass. Same
        # script and same checksummed version the test job installs.
        run: |
          sudo bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Install zig
        run: sudo bash scripts/linux-deps.sh --install-zig
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      - name: Lint
        run: bash scripts/lint.sh

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            .swiftpm
            .zig-cache
            .zig-cache-local
          # The toolchain version files belong in the key: a restore of a
          # .build or .zig-cache written by another Swift or Zig is a build
          # against a compiler this tree does not pin. No restore-keys
          # fallback for the same reason: a prefix that ignores the hash also
          # ignores the toolchain, so it would hand back exactly the cache the
          # key exists to keep out.
          #
          # linux-system-names.txt is here because it is build input in two
          # directions: Package.swift copies it as an AppAtticScan resource
          # (through Sources/AppAtticScan/linux-system-names.txt, a symlink to
          # it) and the Zig core reads the same bytes. Editing it changes the
          # compiled library and the WASM modules, and a key without the data
          # file serves a cache the file has already invalidated. core/bench
          # is the same case for `zig fmt --check` and the benchmark build.
          # core/host and core/build-flags.sh are the same case for the C host
          # every WASM pass links: the host is compiled with the flag list
          # build-flags.sh carries, and neither is in .build or the zig cache,
          # so an edit to one changes the artifact with a key that did not move.
          key: >-
            ${{ runner.os }}-${{ github.job }}-${{
            hashFiles('Package.resolved', 'Package.swift', '.swift-version',
            '.zig-version', 'Sources/**/*.swift', 'tests/**/*.swift',
            'benchmarks/**/*.swift', 'core/src/**/*.zig', 'core/src/*.txt',
            'core/bench/*.zig', 'core/host/**', 'core/build-flags.sh') }}
      - name: Install Qt 6
        run: sudo bash scripts/linux-deps.sh --install
      - name: Install Wasmtime C API
        run: |
          sudo bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
      # The threaded code (core/host's PATH apply/restore and the Qt disk walk
      # and leftover-size pools) under ThreadSanitizer, before the Swift build
      # so a data race fails fast rather than after a full compile. Both the C
      # host and the Qt worker-pool checks run here: this job has cc, Qt 6 and
      # the Wasmtime C API that scripts/race-check.sh needs to configure the Qt
      # target. scripts/check.sh --qt runs the same script locally.
      - name: ThreadSanitizer
        run: bash scripts/race-check.sh --qt
      # Last on the list is first on PATH, and `scripts/linux-deps.sh --install`
      # and the zig step above both append /usr/local/bin to it. The runner
      # image ships a newer Swift in that directory and `scripts/find-swift.sh`
      # takes the first `swift` it finds, so the pinned toolchain is installed
      # after them: anywhere earlier and this job builds against a compiler the
      # tree does not pin (5.10.1 is what it needs, which is a 6.4 refusal in
      # this job's history).
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      - name: Test scan library
        # scripts/test.sh, not the raw command: it carries the
        # --disable-automatic-resolution flag, the AppAtticScanTests filter
        # and a .swift-version check, and a contributor runs the same script.
        # The version check is what the jammy container has no other way to
        # enforce, since the job container is pinned by tag alone.
        run: bash scripts/test.sh
        id: swift_test
      - name: Build CLI
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/swift-build.sh
          . scripts/swift-build.sh
          appattic_swift_build debug --product appattic
        if: steps.swift_test.outcome == 'success'
      - name: CLI contract
        # The binary this job already built, checked for exit codes and which
        # stream each result lands on. It ran only in scripts/check.sh, so a
        # stream mix-up or a wrong exit code shipped green here and failed
        # downstream for whoever scripted against the CLI; the AppImage release
        # gates on scripts/test.sh alone, so nothing else in CI caught it
        # either. The script is hermetic (temporary HOME and XDG_* tree) and
        # runs no command that walks the filesystem, so it is safe next to the
        # rest of this job.
        if: steps.swift_test.outcome == 'success'
        run: bash scripts/cli-contract.sh
      - name: Reproducible artifacts
        # The claim the AppImage release ships on: the same source built twice
        # from differently named directories, under a different timezone and
        # SOURCE_DATE_EPOCH, has to be byte-identical. scripts/check.sh runs it
        # locally and check.sh --qt is documented as full CI parity, so a tree
        # that stops being reproducible has to fail here rather than in a
        # release. The job already has zig and cc on PATH, the two things it
        # builds with; it builds into its own temp tree and touches no cache.
        run: bash scripts/verify-reproducible.sh
      - name: Reproducible Swift CLI
        # The same claim for the Swift product, which the step above does not
        # cover: Identity.swift reads #filePath to find
        # core/src/linux-system-names.txt when the resource bundle is missing,
        # so an unmapped checkout path reaches the release binary and two
        # runners on different paths give two different .build/release/appattic.
        # scripts/swift-build.sh maps the root out; this step is what proves it
        # still does. Two release builds, so it runs once, on the job that
        # already has the pinned toolchain.
        run: bash scripts/verify-swift-reproducible.sh
      - name: Link Qt UI
        if: success() || failure()
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
      - name: Upload Qt link proof
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error
      - name: Upload UI renders
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-qt-shots-${{ github.job }}
          path: ui/linux-qt/build/shots/*.png
          if-no-files-found: warn

  jammy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swift:5.10.1-jammy
    # `shell: bash` on every step in this job, and the reason is the
    # container. A step with no `shell:` runs under `sh -e {0}`, and this
    # job's image has dash at /bin/sh, not bash. The runner hands a
    # multi-line step to `sh -e <path-to-the-workflow>`, so dash reads the
    # whole step as one command string: `$GITHUB_ENV` and `$GITHUB_PATH`
    # are never expanded, `set -euo pipefail` is a `set` of options dash
    # does not know (pipefail is a bashism) so the step dies before its
    # first command runs, and `. scripts/swift-build.sh` is a `.` of a
    # string, not a source. Each of those is a red step that says nothing
    # about the tree. The archlinux job below carries the same shell, and
    # so does every multi-line step in the jobs that run on a hosted
    # runner, where `sh` is bash.
    steps:
      - name: Install git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            .swiftpm
            .zig-cache
            .zig-cache-local
          # The toolchain version files belong in the key: a restore of a
          # .build or .zig-cache written by another Swift or Zig is a build
          # against a compiler this tree does not pin. No restore-keys
          # fallback for the same reason: a prefix that ignores the hash also
          # ignores the toolchain, so it would hand back exactly the cache the
          # key exists to keep out.
          #
          # linux-system-names.txt is here because it is build input in two
          # directions: Package.swift copies it as an AppAtticScan resource
          # (through Sources/AppAtticScan/linux-system-names.txt, a symlink to
          # it) and the Zig core reads the same bytes. Editing it changes the
          # compiled library and the WASM modules, and a key without the data
          # file serves a cache the file has already invalidated. core/bench
          # is the same case for `zig fmt --check` and the benchmark build.
          # core/host and core/build-flags.sh are the same case for the C host
          # every WASM pass links: the host is compiled with the flag list
          # build-flags.sh carries, and neither is in .build or the zig cache,
          # so an edit to one changes the artifact with a key that did not move.
          key: >-
            ${{ runner.os }}-${{ github.job }}-${{
            hashFiles('Package.resolved', 'Package.swift', '.swift-version',
            '.zig-version', 'Sources/**/*.swift', 'tests/**/*.swift',
            'benchmarks/**/*.swift', 'core/src/**/*.zig', 'core/src/*.txt',
            'core/bench/*.zig', 'core/host/**', 'core/build-flags.sh') }}
      - name: Install Qt 6
        run: bash scripts/linux-deps.sh --install
        shell: bash
      - name: Install Wasmtime C API
        run: |
          bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
        shell: bash
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
        shell: bash
      - name: Test scan library
        run: bash scripts/test.sh
        id: swift_test_jammy
        shell: bash
      - name: Build CLI
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/swift-build.sh
          . scripts/swift-build.sh
          appattic_swift_build debug --product appattic
        if: steps.swift_test_jammy.outcome == 'success'
        shell: bash
      - name: Link Qt UI
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
      - name: Upload Qt link proof
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error

  archlinux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:base-devel
    # shell: bash for the same reason as the jammy job above: this image's
    # /bin/sh is dash too.
    steps:
      - name: Install git
        # actions/checkout is git, and archlinux:base-devel has no git. Only git
        # here: the Qt, cmake, clang, curl and xz packages come from
        # scripts/linux-deps.sh below, the same install path a host uses, so this
        # job cannot carry a second, hand-maintained copy of that list. Zig is
        # not a pacman package either: --install puts the checksummed
        # .zig-version tarball on PATH.
        run: pacman -Syu --noconfirm --needed git ca-certificates
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache
            .zig-cache-local
          # The same input set as the Zig half of the test job's key: the
          # name list is read by core/src at build time, the benchmark is part
          # of the Zig tree, and the C host the modules link is compiled from
          # core/host with the flag list core/build-flags.sh carries. A key
          # that omits an input is a key that serves the cache that input
          # already invalidated.
          key: >-
            ${{ runner.os }}-${{ github.job }}-${{
            hashFiles('.zig-version', 'core/src/**/*.zig', 'core/src/*.txt',
            'core/bench/*.zig', 'core/host/**', 'core/build-flags.sh') }}
      - name: Install Qt 6 and build tools
        run: bash scripts/linux-deps.sh --install
        shell: bash
      - name: Install Wasmtime C API
        run: |
          bash scripts/linux-deps.sh --install-wasmtime
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
        shell: bash
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo /usr/local/bin >> "$GITHUB_PATH"
        shell: bash
      - name: Link Qt UI
        run: |
          set -euo pipefail
          bash scripts/linux-qt-link.sh
          bash scripts/verify-qt-link.sh
        shell: bash
      - name: Upload Qt link proof
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-qt-link-${{ github.job }}
          path: ui/linux-qt/build/LINUX_QT_LINK.txt
          if-no-files-found: error
