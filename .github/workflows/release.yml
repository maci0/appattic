name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per ref: a re-dispatch or a re-run must not race the
# in-flight build into the same tag's release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The only job that writes: everything else stays at the workflow's
    # contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so check-version.sh can see the existing tags: without
          # them it cannot tell that the declared version is already a published
          # release, and the immutability check passes on a shallow clone.
          fetch-depth: 0
      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            .swiftpm
            .zig-cache
            .zig-cache-local
            dist/.appimage-tools
          # The toolchain version files and every source the caches are derived
          # from belong in the key: a restore of a .build or .zig-cache written
          # by another Swift, another Zig, or another source revision is a
          # build against a tree this tag does not name. No restore-keys
          # fallback for the same reason: a prefix that ignores the hash also
          # ignores the toolchain and the sources, so it would hand back exactly
          # the cache the key exists to keep out.
          key: >-
            ${{ runner.os }}-appimage-${{
            hashFiles('scripts/dep-checksums.sha256', 'scripts/deps.sh',
            'Package.resolved', 'Package.swift', '.swift-version',
            '.zig-version', 'Sources/**/*.swift', 'tests/**/*.swift',
            'core/src/**/*.zig') }}
      # The tag check and the release notes need nothing but the checkout
      # above, so they run before the toolchain and the test suite. A mistagged
      # push is the common failure and it is caught in seconds instead of
      # after a full Swift build.
      - name: Check the tag matches the declared version, and is not already released
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check-version.sh --tag "$GITHUB_REF_NAME"
      # The AppStream <description> is the release note. The GitHub release
      # page is where a user reads before downloading, so it gets the same
      # text rather than the generated commit list action-gh-release builds by
      # default: that list is a second changelog, and it says nothing about
      # what a caller has to change. The script exits 1 on an empty note, so a
      # release cannot be published with a blank body.
      - name: Take the release notes from the AppStream metainfo
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Install Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      # linux.yml runs this on the tag push too, but nothing makes the release
      # wait for it: without a gate here, a failing test still ships the
      # AppImage, because the two workflows build in parallel. It runs before
      # the Qt install so a red suite stops the job before it spends the time.
      - name: Test scan library
        run: bash scripts/test.sh
      - name: Install Qt 6 and build tools
        run: sudo bash scripts/linux-deps.sh --install
      - name: Install Wasmtime C API
        run: sudo bash scripts/linux-deps.sh --install-wasmtime
      - name: Put zig on PATH
        run: |
          echo /opt/zig >> "$GITHUB_PATH"
          echo "WASMTIME_DIR=/opt/wasmtime-c-api" >> "$GITHUB_ENV"
      - name: Build AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/linux-appimage.sh
      - name: Publish AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/AppAttic-x86_64.AppImage
            dist/AppAttic-x86_64.AppImage.zsync
            dist/AppAttic-x86_64.AppImage.buildinfo
            dist/AppAttic-x86_64.AppImage.sbom.json
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md

  macos-ui:
    # Two switches, both flipped together: `if` re-enables the job, and
    # `continue-on-error` is what decides whether its failure is visible.
    # Re-enabling with the flag left true turns a red scan suite into a green
    # release, because the steps below the test gate are the ones that write.
    # Drop continue-on-error when this job comes back rather than leaving a
    # deploy whose failure nobody sees.
    if: false  # optional; re-enable when AppAtticUI CI build is stable
    runs-on: macos-14
    timeout-minutes: 60
    continue-on-error: true
    # Same as linux-appimage: this job publishes through action-gh-release, and
    # the workflow default is contents: read. Without the override the publish
    # step fails on a permission error the moment the job is re-enabled.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, for the same reason linux-appimage checks it out
          # that way: check-version.sh has to see the existing tags, or the
          # immutability check passes on a shallow clone and a released version
          # can be shipped a second time.
          fetch-depth: 0
      # The same two gates linux-appimage runs, so re-enabling this job cannot
      # publish a macOS zip that the AppImage job would have refused: a tag
      # that does not match the declared version, a version already released,
      # or a red scan suite. The tag check needs only the checkout; the test
      # needs the toolchain, so it goes after setup-swift, which is where
      # linux-appimage puts it too.
      - name: Check the tag matches the declared version, and is not already released
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check-version.sh --tag "$GITHUB_REF_NAME"
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "5.10.1"
      - name: Test scan library
        run: bash scripts/test.sh
      - name: Build AppAtticUI
        run: swift build -c release --product AppAtticUI --disable-automatic-resolution
      - name: Package macOS zip
        # set -euo pipefail, the spelling every other multi-line step in this
        # tree uses (linux.yml's Qt link steps). Without it a failed
        # `deps.sh sbom` left the step green and published a zip with no SBOM
        # beside it.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .build/release/AppAtticUI dist/
          bash scripts/deps.sh sbom dist/AppAttic-macos-arm64.sbom.json
          epoch="${SOURCE_DATE_EPOCH:-$(git log -1 --pretty=%ct 2>/dev/null || printf 0)}"
          # BSD touch (macOS) has no -h and no @epoch form, and BSD date has no
          # -d: -t and -r are the one spelling of each that macOS accepts.
          stamp="$(date -u -r "$epoch" +%Y%m%d%H%M.%S)"
          find dist -name AppAtticUI -exec touch -t "$stamp" {} +
          (cd dist && find AppAtticUI -type f | LC_ALL=C sort | TZ=UTC zip -X -q AppAttic-macos-arm64.zip -@)
          # The zip is the artifact; a run that wrote no file would otherwise
          # pass and reach `zip` below it as a missing input.
          test -f dist/AppAttic-macos-arm64.zip
          test -f dist/AppAttic-macos-arm64.sbom.json
      - name: Take the release notes from the AppStream metainfo
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish macOS zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/AppAttic-macos-arm64.zip
            dist/AppAttic-macos-arm64.sbom.json
          fail_on_unmatched_files: true
          # Same body the AppImage job publishes, for the reason that job's
          # step is commented for: one changelog, the one that ships in the
          # package, not a second generated commit list.
          body_path: ${{ runner.temp }}/release-notes.md
